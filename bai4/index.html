<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4: Style</title>
    <style>
        h2 {
            color: pink;
            background-color: black;
        }

        h3 {
            color: yellow;
            background-color: green;
        }
    </style>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Cách 1: Inline Style -->
    <!-- Background-color: Màu nền -->
     <h1 style="color: blue; background-color: orange"> Bài STYLE </h1>
    <!-- Ưu tiên Inline --> 
    
    <!-- Cách 2: Internal Style  -->
    <h2> Cách 2: Internal Style </h2> 
    <h3> Star Link </h3>

    <!-- Cách 3: External Style -->
    <h4> Cách 3: External Style </h4>
    <!-- External vs internal có thứ tự ngang bằng nhau -->
</body>
</html>
